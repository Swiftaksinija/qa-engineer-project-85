functional:
  - Игрок должен иметь возможность создать игру и выбрать язык программирования (JS, PHP, Python, Ruby).
  - Игрок должен иметь возможность вступить в уже созданную открытую игру из списка.
  - Система должна отображать написание кода соперника в режиме реального времени.
  - Система должна запускать тесты для написанного кода и отображать их результаты обоим игрокам.
  - Игроки и зрители должны иметь возможность общаться в чате внутри игровой сессии.
  - Система должна фиксировать победу того игрока, чей код первым успешно прошел все тесты.
  - Наличие функционала "Игра с ботом" для одиночного режима.
  - Наличие системы рейтингов (лидерборд) для отслеживания успехов пользователей.

non-functional:
  - Производительность: время отклика при отображении кода соперника не должно создавать заметных задержек (real-time синхронизация).
  - Масштабируемость: система должна выдерживать до 1000 одновременных пользователей без деградации производительности.
  - Кроссбраузерность: корректная работа в последних версиях Chrome, Firefox, Safari, Edge.
  - Адаптивность: интерфейс должен быть удобен для использования на мобильных устройствах.
  - Безопасность: изоляция среды выполнения кода (sandbox), чтобы пользовательский код не мог навредить серверу.

implicit:
  - Игрок не должен иметь возможности редактировать код соперника.
  - После завершения игры ввод кода должен блокироваться для обоих участников.
  - Если один игрок покидает страницу, игра не должна "зависать" для второго (корректная обработка дисконнекта).
  - Код пользователя должен сохраняться при случайной перезагрузке страницы.
  - При попытке зайти в игру, которая уже закончилась, пользователь должен видеть финальный результат или сообщение о завершении.
