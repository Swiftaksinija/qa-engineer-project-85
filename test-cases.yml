- summary: |
    Проверка успешного входа в систему через аккаунт GitHub.
  requirement: |
    Сайт должен поддерживать авторизацию через внешние сервисы (GitHub).
  prerequisites: |
    - Пользователь имеет активный аккаунт на GitHub.
    - Открыта главная страница Codebattle.
    - Пользователь не авторизован в системе.
  test-data: |
    Учетные данные GitHub (логин/пароль).
  steps:
    - Нажать на кнопку «Sign in with GitHub».
    - Ввести логин и пароль от GitHub в появившемся окне (если сессия не активна).
    - Разрешить доступ приложению Codebattle (при первом входе).
  expected-result: |
    Происходит редирект на главную страницу Codebattle, в шапке профиля отображается аватар и никнейм пользователя из GitHub.

- summary: |
    Проверка создания профиля пользователя при первом входе.
  requirement: |
    Система должна автоматически создавать профиль для нового пользователя при первой авторизации.
  prerequisites: |
    Аккаунт GitHub, который ранее никогда не использовался в Codebattle.
  test-data: |
    Новый аккаунт GitHub.
  steps:
    - Выполнить вход через GitHub.
    - Перейти в раздел «Profile» или «Settings».
  expected-result: |
    Профиль создан успешно, установлены значения по умолчанию (рейтинг 0, статистика игр пуста), данные синхронизированы с GitHub.

- summary: |
    Проверка завершения сессии пользователя.
  requirement: |
    Пользователь должен иметь возможность безопасно выйти из своего аккаунта.
  prerequisites: |
    Пользователь авторизован в системе.
  test-data: |
    Кнопка «Sign Out» в меню профиля.
  steps:
    - Нажать на аватар пользователя в верхнем меню.
    - Выбрать пункт «Sign Out».
  expected-result: |
    Сессия завершена, пользователь перенаправлен на лендинг (страницу приветствия), кнопка входа снова доступна.

- summary: |
    Проверка создания игры против бота.
  requirement: |
    Пользователь должен иметь возможность создать игру, выбрав уровень сложности и язык.
  prerequisites: |
    Пользователь авторизован и находится на главной странице (Lobby).
  test-data: |
    Сложность: "Easy"/"Elementary", Язык: "JavaScript".
  steps:
    - Нажать кнопку «Create a battle».
    - Выбрать уровень сложности (например, "Easy"/"Elementary").
    - Выбрать переключатель «With a bot».
    - Выбрать язык "JavaScript".
    - Нажать «Create battle».
  expected-result: |
    Создана новая игровая комната. Пользователь мгновенно перемещен в редактор. Противник — бот

- summary: |
    Проверка создания публичной игры и её отображения в Lobby.
  requirement: |
    Публичная игра должна появляться в списке доступных битв для других игроков.
  prerequisites: |
    Пользователь авторизован.
  test-data: |
    Сложность: по вашему выбору, Тип: "With other user".
  steps:
    - Нажать кнопку «Create a battle».
    - Выбрать уровень сложности.
    - Нажать кнопку «With other user».
    - Нажать «Create battle».
    - Перейти на вкладку "Lobby" (или попросить другого пользователя проверить список).
  expected-result: |
    В разделе "Join a battle" в Лобби появилась новая карточка игры с именем создателя. Статус игры — "Waiting for opponent".

- summary: |
    Проверка функционала досрочного завершения игры («Сдаться»).
  requirement: |
    Пользователь должен иметь возможность прекратить игру с признанием поражения.
  prerequisites: |
    Пользователь находится внутри активной игровой сессии.
  test-data: |
    Кнопка «Give up»
  steps:
    - Нажать на панели в в интерфейсе на три точки.
    - Нажать кнопку «Give up» в интерфейсе редактора.
    - Подтвердить действие в появившемся модальном окне.
  expected-result: |
    Игра завершается. В окне результата отображается статус "Lost" или выходит картинка. Кнопки редактирования кода блокируются.

- summary: |
    Проверка автоматического завершения игры по таймеру.
  requirement: |
    Игра должна принудительно завершаться, если время на решение задачи истекло.
  prerequisites: |
    Пользователь находится в игре, время на таймере близко к 00:00.
  test-data: |
    Таймер в верхней части экрана.
  steps:
    - Дождаться истечения времени, установленного для задачи (Time control).
    - Попытаться изменить код после обнуления таймера.
  expected-result: |
    По истечении времени появляется уведомление о завершении игры. Поле ввода кода становится неактивным.

- summary: |
    Проверка отображения ввода кода соперника в реальном времени.
  requirement: |
    Система должна транслировать процесс написания кода соперника второму игроку.
  prerequisites: |
    Два игрока (A и B) вошли в одну игровую сессию. У обоих открыты окна редакторов.
  test-data: |
    Строка кода: "const sum = require("lodash")"
  steps:
    - Игрок А начинает посимвольно вводить тестовую строку кода в своем редакторе.
    - Игрок B наблюдает за панелью «Opponent's code».
  expected-result: |
    Каждый символ, введенный Игроком А, появляется в окне Игрока B мгновенно (задержка менее 500 мс).

- summary: |
    Завершение игры при написании корректного решения.
  requirement: |
    Система должна фиксировать победу, если код прошел все автоматические тесты.
  prerequisites: |
    Игрок находится в активной игре. Редактор содержит корректное решение задачи.
  test-data: |
    Верный код решения задачи на выбранном языке.
  steps:
    - Вставить корректный код в редактор.
    - Нажать кнопку «Check».
  expected-result: |
    Появляется сообщение «All tests passed!». Статус игрока меняется на «Winner», игра завершается.

- summary: |
    Обработка синтаксической ошибки в решении.
  requirement: |
    Система должна информировать пользователя о синтаксических ошибках в его коде.
  prerequisites: |
    Игрок в активной игре.
  test-data: |
    Код с пропущенной скобкой: "function test( {"
  steps:
    - Ввести некорректный код в редактор.
    - Нажать кнопку «Check».
  expected-result: |
    Система выдает сообщение об ошибке (Syntax Error) в консоли под редактором с указанием строки или подсвечивает красным то место, где совершена ошибка.

- summary: |
    Проверка оповещения, если у соперника пропадет интернет или он закроет сайт.
  requirement: |
    Сайт должен сообщать, если соперник «отвалился».
  prerequisites: |
    Я открыла игру в двух окнах (Я и Соперник).
  test-data: |
    Закрытие вкладки.
  steps:
    - В одном из окон просто закрыть вкладку с игрой.
    - Посмотреть, что произойдет в другом окне.
  expected-result: |
    У оставшегося игрока должно появиться сообщение, что его соперник покинул игру.

- summary: |
    Проверка адаптивности отображения блоков в Лобби на мобильном разрешении.
  requirement: |
    Интерфейс Лобби должен корректно перестраиваться под вертикальную ориентацию экрана без потери функциональности.
  prerequisites: |
    Пользователь авторизован и находится в Lobby. Браузер в режиме эмуляции мобильного устройства.
  test-data: |
    Эмуляция на iPhone 13 Pro.
  steps:
    - Открыть главную страницу.
    - Пролистать страницу вниз до футера.
    - Проверить, не выходят ли блоки "Upcoming Tournaments" за правую границу экрана.
  expected-result: |
    Все блоки (Турниры, Профиль, Рейтинг) выстроены в одну колонку. Горизонтальная полоса прокрутки отсутствует.

- summary: |
    Проверка корректного отображения элементов навигации в мобильном режиме.
  requirement: |
    Все важные элементы управления (кнопки возврата, чат, выбор языка) должны полностью помещаться в пределах ширины экрана смартфона без использования горизонтальной прокрутки.
  prerequisites: |
    Пользователь находится в активной игре. Включен режим мобильного просмотра.
  test-data: |
    Разрешение: 390x801 px. Элемент: Кнопка «На главную» (Back to Home).
  steps:
    - Открыть страницу игры в режиме эмуляции 390x801.
    - Оценить видимость верхней навигационной панели без совершения дополнительных действий.
    - Попробовать проскроллить страницу вправо, чтобы увидеть скрытые элементы.
  expected-result: |
    Кнопка «На главную» полностью видна сразу при загрузке страницы. Горизонтальная прокрутка отсутствует, так как интерфейс адаптирован под ширину 390px.

- summary: |
    Проверка отображения чата и экранной клавиатуры.
  requirement: |
    При открытии чата и вводе текста экранная клавиатура не должна полностью перекрывать поле ввода или кнопку отправки.
  prerequisites: |
    Пользователь находится в Лобби или в игре, где доступен чат.
  test-data: |
    Input text: "Hello, testing mobile chat!". Focus: Поле ввода сообщения.
  steps:
    - Нажать на поле ввода в чате (внизу экрана).
    - Ввести тестовое сообщение.
  expected-result: |
    Поле ввода поднимается над виртуальной клавиатурой. Пользователь видит, что он печатает. Кнопка отправки остается видимой.

- summary: |
    Проверка открытия списка настроек профиля.
  requirement: |
    Список настроек должен быть читабельным и полностью помещаться на экране смартфона.
  prerequisites: |
    Пользователь находится на любой странице сайта в мобильной версии.
  test-data: |
    Клик по своему нику.
  steps:
    - Нажать на никнейм/аватар в верхнем баре.
    - Проверить отображение выпадающего списка (Настройки, Выйти и т.д.).
  expected-result: |
    Меню раскрывается вниз. Текст пунктов (Мой профиль, Настройки) крупный и четкий. Меню не уходит за нижнюю границу экрана.

- summary: |
    Проверка того, что сайт выглядит и работает одинаково в разных браузерах.
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями популярных браузеров.
  prerequisites: |
    На компьютере установлены как минимум два разных браузера (например, Google Chrome и Mozilla Firefox).
  test-data: |
    Ссылка на главную страницу Codebattle.
  steps:
    - Открыть сайт в браузере №1 (например, Chrome).
    - Запомнить, как выглядят кнопки, меню и список игр.
    - Открыть этот же сайт в браузере №2 (например, Firefox или Safari).
    - Сравнить внешний вид и попробовать нажать на кнопку «Lobby».
  expected-result: |
    В обоих браузерах сайт выглядит одинаково: кнопки не съехали, текст читается, навигация работает исправно.

- summary: |
    Проверка актуальности списка доступных поединков в окне "Join a battle".
  requirement: |
    Окно должно отображать список реальных игроков или ботов, ожидающих сражения, с указанием их уровня сложности.
  prerequisites: |
    Пользователь находится в Лобби.
  test-data: |
    Кнопка "Join a battle".
  steps:
    - Нажать на кнопку "Join a battle".
    - Изучить список в модальном окне.
    - Сравнить уровень сложности (звёзды) и имена игроков (например, CypherCipher).
  expected-result: |
    Открывается модальное окно "Join a battle". Список содержит активные заявки. Каждая строка имеет активную кнопку "Сражаться".

- summary: |
    Проверка перехода на страницу глобального рейтинга (Hall of Fame).
  requirement: |
    Текстовая ссылка «VIEW HALL OF FAME» должна быть кликабельной и вести на страницу с рейтингом игроков.
  prerequisites: |
    Пользователь находится в Лобби.
  test-data: |
    Элемент «VIEW HALL OF FAME».
  steps:
    - Найти надпись «VIEW HALL OF FAME» под блоком дат сезона.
    - Нажать на неё.
  expected-result: |
    Происходит переход на страницу лидеров лиги.

- summary: |
    Проверка возможности присоединиться к текущему турниру (Live Tournament).
  requirement: |
    Если турнир имеет статус «Playing», кнопка «Join» должна быть активна.
  prerequisites: |
    В Лобби в разделе «LIVE TOURNAMENTS» отображается активный турнир.
  test-data: |
    Кнопка «Join».
  steps:
    - В центральном блоке найти активный турнир.
    - Нажать кнопку «Join» рядом со статусом турнира.
  expected-result: |
    Пользователь переходит на страницу турнира или включается в список участников.

- summary: |
    Проверка доступности чата в Лобби.
  requirement: |
    Нижняя панель должна отображать текущий канал чата и количество игроков онлайн.
  prerequisites: |
    Пользователь находится в Лобби.
  test-data: |
    Нижняя панель (Footer).
  steps:
    - Посмотреть на нижнюю часть экрана под списком турниров.
    - Убедиться, что статус канала — «Joined channel Chat:lobby».
  expected-result: |
    Пользователь видит панель чата, статус подключения к каналу лобби и общее количество игроков онлайн (например, «Online players: 7»).

- summary: |
    Проверка доступности страницы персональных настроек пользователя.
  requirement: |
    Пользователь должен иметь возможность перейти в раздел редактирования профиля через главное меню.
  prerequisites: |
    Пользователь авторизован и нажал на свой никнейм в правом верхнем углу для вызова меню.
  test-data: |
    Пункт меню «Настройки».
  steps:
    - Кликнуть по своему нику.
    - В выпадающем списке выбрать «Настройки».
  expected-result: |
    Происходит переход на страницу настроек профиля (URL меняется на соответствующий настройкам).

- summary: |
    Проверка интеграции с внешними каналами связи (Discord/Telegram).
  requirement: |
    Ссылки на чаты сообщества должны вести на корректные внешние ресурсы.
  prerequisites: |
    Меню профиля открыто.
  test-data: |
    Пункты «Чат Discord» или «Чат телеграмм».
  steps: Нажать на пункт «Чат телеграмм».
  expected-result: |
    В новой вкладке открывается приложение или веб-страница Telegram с приглашением в группу/канал Hexlet Codebattle.
